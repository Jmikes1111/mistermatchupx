<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MisterMatchup — Settle the Debate</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #07100d;
  --panel: #0d1915;
  --panel2: #12221c;
  --border: #233a30;
  --text: #f3f7f5;
  --muted: #91a39b;
  --green: #39d98a;
  --green2: #1da866;
  --red: #ff6262;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at top, #123025 0%, var(--bg) 42%);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
}

button,
select {
  font: inherit;
}

.container {
  width: min(1100px, 92%);
  margin: auto;
}

header {
  padding: 24px 0;
  border-bottom: 1px solid rgba(255,255,255,.06);
}

.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 1.5px;
}

.logo span {
  color: var(--green);
}

.badge {
  border: 1px solid var(--border);
  color: var(--green);
  padding: 7px 11px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
}

.hero {
  text-align: center;
  padding: 70px 0 35px;
}

.hero h1 {
  margin: 0;
  font-size: clamp(42px, 8vw, 78px);
  line-height: .95;
  letter-spacing: -4px;
}

.hero h1 span {
  color: var(--green);
}

.hero p {
  color: var(--muted);
  font-size: 18px;
  margin: 22px auto 0;
  max-width: 600px;
}

.sports {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 30px 0;
  flex-wrap: wrap;
}

.sport {
  padding: 9px 15px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

.sport.active {
  background: rgba(57,217,138,.12);
  border-color: var(--green2);
  color: var(--green);
}

.card {
  background: rgba(13,25,21,.94);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 28px;
  box-shadow: 0 25px 70px rgba(0,0,0,.25);
}

.matchup {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 18px;
  align-items: end;
}

.field label {
  display: block;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .8px;
  text-transform: uppercase;
  margin-bottom: 9px;
}

select {
  width: 100%;
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 16px;
  border-radius: 13px;
  outline: none;
}

select:focus {
  border-color: var(--green);
}

.vs {
  font-size: 15px;
  font-weight: 900;
  color: var(--green);
  padding-bottom: 16px;
}

.options {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 22px 0;
  gap: 15px;
  flex-wrap: wrap;
}

.home-toggle {
  display: flex;
  gap: 10px;
  align-items: center;
  color: var(--muted);
  font-size: 14px;
}

.home-toggle input {
  accent-color: var(--green);
  width: 17px;
  height: 17px;
}

.run {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 17px;
  background: var(--green);
  color: #04120b;
  font-weight: 900;
  font-size: 16px;
  cursor: pointer;
  transition: .2s;
}

.run:hover {
  transform: translateY(-1px);
  filter: brightness(1.08);
}

.run:disabled {
  opacity: .5;
  cursor: wait;
}

.status {
  text-align: center;
  margin-top: 15px;
  color: var(--muted);
  font-size: 12px;
}

.results {
  display: none;
  margin-top: 28px;
}

.results.show {
  display: block;
}

.pick {
  text-align: center;
  padding: 25px;
  background: linear-gradient(135deg, rgba(57,217,138,.12), rgba(57,217,138,.025));
  border: 1px solid rgba(57,217,138,.25);
  border-radius: 18px;
}

.pick-label {
  color: var(--muted);
  text-transform: uppercase;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1.5px;
}

.pick-team {
  font-size: clamp(30px, 7vw, 48px);
  font-weight: 900;
  margin-top: 7px;
}

.pick-sub {
  color: var(--green);
  font-weight: 800;
  margin-top: 8px;
}

.probabilities {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 15px;
}

.prob {
  background: var(--panel2);
  border: 1px solid var(--border);
  padding: 20px;
  border-radius: 16px;
  text-align: center;
}

.prob .team {
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
}

.prob .percentage {
  font-size: 38px;
  font-weight: 900;
  margin-top: 5px;
}

.score {
  font-size: 14px;
  color: var(--muted);
  margin-top: 4px;
}

.why {
  margin-top: 15px;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
}

.why h3 {
  margin: 0 0 9px;
  font-size: 14px;
}

.why p {
  color: var(--muted);
  line-height: 1.6;
  margin: 0;
}

.result-actions {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.secondary {
  flex: 1;
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 13px;
  cursor: pointer;
}

.secondary:hover {
  border-color: var(--green);
}

footer {
  text-align: center;
  color: #607169;
  font-size: 12px;
  padding: 50px 0;
}

@media (max-width: 650px) {
  .hero {
    padding-top: 50px;
  }

  .hero h1 {
    letter-spacing: -2px;
  }

  .card {
    padding: 19px;
    border-radius: 17px;
  }

  .matchup {
    grid-template-columns: 1fr;
  }

  .vs {
    text-align: center;
    padding: 0;
  }

  .probabilities {
    grid-template-columns: 1fr;
  }

  .result-actions {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<header>
  <div class="container nav">
    <div class="logo">MISTER<span>MATCHUP</span></div>
    <div class="badge">NFL BETA</div>
  </div>
</header>

<main class="container">

  <section class="hero">
    <h1>SETTLE THE<br><span>DEBATE.</span></h1>
    <p>
      Put any two teams against each other and let 10,000 simulations
      decide who wins.
    </p>

    <div class="sports">
      <div class="sport active">NFL</div>
      <div class="sport">NBA — SOON</div>
      <div class="sport">MLB — SOON</div>
      <div class="sport">NHL — SOON</div>
    </div>
  </section>

  <section class="card">

    <div class="matchup">

      <div class="field">
        <label>Team 1</label>
        <select id="team1"></select>
      </div>

      <div class="vs">VS</div>

      <div class="field">
        <label>Team 2</label>
        <select id="team2"></select>
      </div>

    </div>

    <div class="options">
      <label class="home-toggle">
        <input type="checkbox" id="homeTeam" checked>
        Team 1 has home-field advantage
      </label>
    </div>

    <button class="run" id="runButton">
      RUN 10,000 SIMULATIONS
    </button>

    <div class="status" id="status">
      Initializing simulation engine...
    </div>

    <div class="results" id="results">

      <div class="pick">
        <div class="pick-label">MisterMatchup Pick</div>
        <div class="pick-team" id="winner"></div>
        <div class="pick-sub" id="confidence"></div>
      </div>

      <div class="probabilities">

        <div class="prob">
          <div class="team" id="team1Result"></div>
          <div class="percentage" id="prob1"></div>
          <div class="score" id="score1"></div>
        </div>

        <div class="prob">
          <div class="team" id="team2Result"></div>
          <div class="percentage" id="prob2"></div>
          <div class="score" id="score2"></div>
        </div>

      </div>

      <div class="why">
        <h3>WHY?</h3>
        <p id="whyText"></p>
      </div>

      <div class="result-actions">
        <button class="secondary" id="again">RUN AGAIN</button>
        <button class="secondary" id="newMatchup">NEW MATCHUP</button>
      </div>

    </div>

  </section>

</main>

<footer>
  MISTERMATCHUP — SETTLE THE DEBATE.
</footer>

<script>
/*
  MISTERMATCHUP
  NFL Monte Carlo Engine

  Every simulation independently generates a score for both teams.
  The engine runs exactly 10,000 trials per matchup.
*/

const TEAMS = {

  "Arizona Cardinals": {off: 20.8, def: 23.5, strength: -2.1},
  "Atlanta Falcons": {off: 22.1, def: 21.8, strength: 0.2},
  "Baltimore Ravens": {off: 27.2, def: 22.4, strength: 4.1},
  "Buffalo Bills": {off: 28.4, def: 19.8, strength: 5.8},
  "Carolina Panthers": {off: 18.6, def: 25.7, strength: -5.7},
  "Chicago Bears": {off: 21.2, def: 21.5, strength: 0.1},
  "Cincinnati Bengals": {off: 23.8, def: 21.1, strength: 2.8},
  "Cleveland Browns": {off: 17.4, def: 24.7, strength: -5.4},
  "Dallas Cowboys": {off: 25.4, def: 24.1, strength: 1.0},
  "Denver Broncos": {off: 21.9, def: 19.7, strength: 2.6},
  "Detroit Lions": {off: 28.1, def: 20.4, strength: 6.0},
  "Green Bay Packers": {off: 24.9, def: 19.5, strength: 5.2},
  "Houston Texans": {off: 23.5, def: 19.3, strength: 4.5},
  "Indianapolis Colts": {off: 25.1, def: 22.2, strength: 2.1},
  "Jacksonville Jaguars": {off: 21.4, def: 22.7, strength: -0.8},
  "Kansas City Chiefs": {off: 24.7, def: 20.1, strength: 4.7},
  "Las Vegas Raiders": {off: 19.1, def: 24.5, strength: -4.2},
  "Los Angeles Chargers": {off: 23.8, def: 20.8, strength: 3.4},
  "Los Angeles Rams": {off: 24.6, def: 22.1, strength: 2.7},
  "Miami Dolphins": {off: 25.8, def: 25.0, strength: 0.4},
  "Minnesota Vikings": {off: 24.2, def: 20.2, strength: 4.0},
  "New England Patriots": {off: 20.2, def: 22.8, strength: -1.4},
  "New Orleans Saints": {off: 19.8, def: 22.3, strength: -1.7},
  "New York Giants": {off: 17.8, def: 25.2, strength: -5.0},
  "New York Jets": {off: 16.9, def: 23.8, strength: -4.8},
  "Philadelphia Eagles": {off: 26.3, def: 20.0, strength: 5.7},
  "Pittsburgh Steelers": {off: 21.5, def: 18.7, strength: 4.2},
  "San Francisco 49ers": {off: 25.7, def: 21.2, strength: 4.6},
  "Seattle Seahawks": {off: 24.1, def: 20.9, strength: 3.3},
  "Tampa Bay Buccaneers": {off: 24.3, def: 23.0, strength: 1.3},
  "Tennessee Titans": {off: 18.7, def: 24.8, strength: -5.1},
  "Washington Commanders": {off: 23.1, def: 23.4, strength: -0.2}

};

const teamNames = Object.keys(TEAMS);

const team1 = document.getElementById("team1");
const team2 = document.getElementById("team2");
const runButton = document.getElementById("runButton");
const results = document.getElementById("results");
const status = document.getElementById("status");

teamNames.forEach(team => {
  team1.add(new Option(team, team));
  team2.add(new Option(team, team));
});

team1.value = "Cincinnati Bengals";
team2.value = "Baltimore Ravens";


function gaussian(mean, std) {

  let u = 0;
  let v = 0;

  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();

  return mean +
    std *
    Math.sqrt(-2 * Math.log(u)) *
    Math.cos(2 * Math.PI * v);
}


function expectedScore(teamA, teamB, homeAdvantage) {

  const A = TEAMS[teamA];
  const B = TEAMS[teamB];

  /*
    Offensive production contributes positively.
    Opponent defense contributes inversely.
    Strength differential provides a broader team-quality adjustment.
  */

  let scoreA =
    21 +
    (A.off - 22) * 0.48 +
    (B.def - 22) * 0.25 +
    (A.strength - B.strength) * 0.55 +
    homeAdvantage;

  let scoreB =
    21 +
    (B.off - 22) * 0.48 +
    (A.def - 22) * 0.25 +
    (B.strength - A.strength) * 0.55;

  return {
    a: Math.max(7, scoreA),
    b: Math.max(7, scoreB)
  };
}


function simulate(teamA, teamB, homeA, trials = 10000) {

  const homeAdvantage = homeA ? 1.7 : 0;

  const expected = expectedScore(
    teamA,
    teamB,
    homeAdvantage
  );

  let winsA = 0;
  let winsB = 0;

  let totalA = 0;
  let totalB = 0;

  for (let i = 0; i < trials; i++) {

    let scoreA = gaussian(expected.a, 9.2);
    let scoreB = gaussian(expected.b, 9.2);

    scoreA = Math.max(0, Math.round(scoreA));
    scoreB = Math.max(0, Math.round(scoreB));

    if (scoreA > scoreB) {
      winsA++;
    } else if (scoreB > scoreA) {
      winsB++;
    } else {

      /*
        NFL games cannot finish tied during the simulation.
        Give overtime winner randomly.
      */

      if (Math.random() < .5) {
        winsA++;
      } else {
        winsB++;
      }
    }

    totalA += scoreA;
    totalB += scoreB;
  }

  return {
    winsA,
    winsB,
    probabilityA: winsA / trials,
    probabilityB: winsB / trials,
    averageA: totalA / trials,
    averageB: totalB / trials,
    trials
  };
}


function confidence(probability) {

  const edge = Math.abs(probability - .5);

  if (edge >= .30) return "VERY HIGH CONFIDENCE";
  if (edge >= .22) return "HIGH CONFIDENCE";
  if (edge >= .14) return "MODERATE CONFIDENCE";
  if (edge >= .07) return "LOW CONFIDENCE";

  return "VERY LOW CONFIDENCE";
}


function explanation(teamA, teamB, result, homeA) {

  const A = TEAMS[teamA];
  const B = TEAMS[teamB];

  const winner =
    result.probabilityA >= result.probabilityB
      ? teamA
      : teamB;

  const winnerData = TEAMS[winner];

  const reasons = [];

  if (winner === teamA && A.off > B.off)
    reasons.push("the stronger offensive profile");

  if (winner === teamB && B.off > A.off)
    reasons.push("the stronger offensive profile");

  if (winner === teamA && A.def < B.def)
    reasons.push("the better defensive profile");

  if (winner === teamB && B.def < A.def)
    reasons.push("the better defensive profile");

  if (winner === teamA && A.strength > B.strength)
    reasons.push("the stronger overall team rating");

  if (winner === teamB && B.strength > A.strength)
    reasons.push("the stronger overall team rating");

  if (winner === teamA && homeA)
    reasons.push("home-field advantage");

  if (winner === teamB && !homeA)
    reasons.push("home-field advantage");

  if (!reasons.length)
    reasons.push("the combined simulation results");

  return `${winner} won the simulation because of ${reasons.slice(0,3).join(", ")}. Across 10,000 simulated games, the model gives ${winner} a ${(Math.max(result.probabilityA, result.probabilityB) * 100).toFixed(1)}% chance to win.`;
}


function runSimulation() {

  const A = team1.value;
  const B = team2.value;

  if (A === B) {
    alert("Please select two different teams.");
    return;
  }

  runButton.disabled = true;
  runButton.textContent = "SIMULATING...";

  status.textContent = "Running 10,000 simulated games...";

  /*
    setTimeout allows the browser to render the loading state
    before performing the simulation.
  */

  setTimeout(() => {

    const homeA =
      document.getElementById("homeTeam").checked;

    const result =
      simulate(A, B, homeA, 10000);

    const winner =
      result.probabilityA >= result.probabilityB
        ? A
        : B;

    const winnerProbability =
      Math.max(
        result.probabilityA,
        result.probabilityB
      );

    document.getElementById("winner").textContent =
      winner;

    document.getElementById("confidence").textContent =
      confidence(winnerProbability);

    document.getElementById("team1Result").textContent =
      A;

    document.getElementById("team2Result").textContent =
      B;

    document.getElementById("prob1").textContent =
      `${(result.probabilityA * 100).toFixed(1)}%`;

    document.getElementById("prob2").textContent =
      `${(result.probabilityB * 100).toFixed(1)}%`;

    document.getElementById("score1").textContent =
      `Projected score: ${Math.round(result.averageA)}`;

    document.getElementById("score2").textContent =
      `Projected score: ${Math.round(result.averageB)}`;

    document.getElementById("whyText").textContent =
      explanation(A, B, result, homeA);

    results.classList.add("show");

    status.textContent =
      `Simulation complete — ${result.trials.toLocaleString()} games simulated.`;

    runButton.disabled = false;
    runButton.textContent = "RUN 10,000 SIMULATIONS";

    results.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }, 30);
}


runButton.addEventListener(
  "click",
  runSimulation
);

document.getElementById("again")
  .addEventListener(
    "click",
    runSimulation
  );

document.getElementById("newMatchup")
  .addEventListener(
    "click",
    () => {

      results.classList.remove("show");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }
  );


/*
  SELF-TEST

  Run 50 different matchups automatically.
  Every matchup must produce exactly 10,000 trials,
  valid probabilities, and valid projected scores.
*/

function selfTest() {

  let passed = 0;

  for (let i = 0; i < 50; i++) {

    let a = teamNames[
      Math.floor(Math.random() * teamNames.length)
    ];

    let b = teamNames[
      Math.floor(Math.random() * teamNames.length)
    ];

    while (b === a) {
      b = teamNames[
        Math.floor(Math.random() * teamNames.length)
      ];
    }

    const result =
      simulate(
        a,
        b,
        Math.random() > .5,
        10000
      );

    const valid =
      result.trials === 10000 &&
      result.winsA + result.winsB === 10000 &&
      Number.isFinite(result.averageA) &&
      Number.isFinite(result.averageB) &&
      Math.abs(
        result.probabilityA +
        result.probabilityB - 1
      ) < .000001;

    if (valid) passed++;
  }

  status.textContent =
    `Engine self-test: ${passed}/50 matchup runs passed. Ready.`;

  console.log(
    `MisterMatchup self-test: ${passed}/50 passed.`
  );
}

selfTest();

</script>

</body>
</html>
